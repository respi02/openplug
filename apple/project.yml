# XcodeGen spec: `xcodegen generate` writes OpenPlug.xcodeproj (not committed).
name: OpenPlug
options:
  bundleIdPrefix: org.openplug
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  OpenPlug:
    path: .
targets:
  OpenPlug:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: OpenPlug
        product: OpenPlugBLE
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenPlug
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: OpenPlug talks to your DataPlug dongle over Bluetooth to read your car's values.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openplug.app
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # the core is built for arm64 only
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
